server {
  listen 8080;
  server_tokens off;
  client_max_body_size 1m;
  location /rest/v1/ {
    proxy_pass http://mw-prod-rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    add_header Cache-Control "no-store" always;
  }
  location / { return 404; }
}
