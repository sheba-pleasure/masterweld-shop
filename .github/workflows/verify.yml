name: verify
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Media backup decoder (pinned wheel hashes)
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r ops/standalone/requirements-media.txt
      - name: Install (lockfile)
        run: bun install --frozen-lockfile
      - name: TypeScript strict check (обязательно)
        run: npm run typecheck
      - name: Environment and release gates
        run: |
          node --test ops/runtime/environment.test.mjs
          python3 -m unittest discover -s ops/production -p 'test_*.py'
          python3 -m unittest discover -s ops/standalone -p 'test_*.py'
      - name: Independent source and dependency graph
        run: node ops/check-independence.mjs
      - name: Assortment transactions (isolated PostgreSQL)
        run: python3 ops/tests/assortment.py
      - name: Catalog import transactions (isolated PostgreSQL)
        run: python3 ops/tests/catalog-import.py
      - name: Direct preview request recovery (isolated PostgreSQL)
        run: python3 ops/tests/preview-requests.py
      - name: Pending result recovery (isolated PostgreSQL)
        run: python3 ops/tests/pending-recovery.py
      - name: Catalog preview recovery (isolated PostgreSQL)
        run: python3 ops/tests/catalog-previews.py
      - name: Catalog draft recovery (isolated PostgreSQL)
        run: python3 ops/tests/catalog-drafts.py
      - name: Document intake and seller enrollment (isolated PostgreSQL)
        run: python3 ops/tests/document-intake.py
      - name: Human table structure correction (isolated PostgreSQL)
        run: python3 ops/tests/document-structure.py
      - name: Offline document extraction and real OCR
        run: |
          docker build --build-arg GIT_SHA="$(git rev-parse HEAD)" -t mw-document-qa -f ops/intake/Dockerfile ops/intake
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=256m --memory 1g --cpus 1 -v "$PWD/ops/intake:/tests:ro" mw-document-qa /usr/bin/python3 /tests/test_extract.py
      - name: Database backup snapshot and restore (isolated PostgreSQL)
        run: python3 ops/tests/database-backup.py
      - name: Technical catalog transactions (isolated PostgreSQL)
        run: python3 ops/tests/technical-catalog.py
      - name: Telegram bot receipts (isolated PostgreSQL)
        run: python3 ops/tests/telegram-bots.py
      - name: Order notification claims and restart (isolated PostgreSQL)
        run: python3 ops/tests/order-notifications.py
      - name: Tests (обязательно)
        run: npm test
      - name: Build default preset (обязательно)
        run: npm run build
      - name: Build node-server + проверка точки входа (обязательно)
        run: |
          rm -rf .output
          NITRO_PRESET=node-server npx vite build
          test -f .output/server/index.mjs
          node ops/check-independence.mjs --built
      - name: Ops shell syntax + synthetic release tests (обязательно)
        run: |
          for f in ops/*.sh ops/tests/*.sh; do bash -n "$f"; done
          bash ops/tests/release-synthetic.sh
      - name: Real Docker gateway release and rollback (synthetic application)
        run: |
          docker pull node:22-bookworm-slim
          docker pull nginx:1.27-alpine
          python3 ops/tests/release-containers.py
      - name: ESLint изменённых файлов (advisory)
        continue-on-error: true
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.ts' '*.tsx' '*.js' 2>/dev/null || true)
          if [ -z "$FILES" ]; then echo "нет изменённых JS/TS файлов"; exit 0; fi
          npx eslint $FILES
      - name: Полный lint (advisory, известный долг ~407 ошибок)
        continue-on-error: true
        run: npm run lint
